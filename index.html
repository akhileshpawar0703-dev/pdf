<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python PDF Reader</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar">
        <div class="toolbar-group">
          <label for="file-input" class="button primary">Open PDF</label>
          <input id="file-input" type="file" accept="application/pdf" hidden />
          <span id="file-name" class="file-name">No file selected</span>
        </div>

        <div class="toolbar-group nav-controls">
          <button id="prev-page" class="button" title="Previous page">◀</button>
          <span class="page-counter">
            <input id="page-number" type="number" min="1" value="1" />
            <span>/</span>
            <span id="total-pages">0</span>
          </span>
          <button id="next-page" class="button" title="Next page">▶</button>
        </div>

        <div class="toolbar-group zoom-controls">
          <button id="zoom-out" class="button" title="Zoom out">−</button>
          <select id="zoom-level" class="select">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
          <button id="zoom-in" class="button" title="Zoom in">+</button>
          <button id="fit-width" class="button">Fit Width</button>
          <button id="rotate" class="button">Rotate</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="thumbnail-panel" id="thumbnail-panel"></aside>

        <section class="viewer-panel" id="viewer-panel">
          <div class="empty-state" id="empty-state">
            <h1>Python-powered PDF Reader</h1>
            <p>Upload a PDF to view it in an Adobe-like layout.</p>
          </div>
          <canvas id="pdf-canvas"></canvas>
        </section>
      </main>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
